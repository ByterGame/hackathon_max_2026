path: /example_codegen/client/create_request
method: post
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/schemas/Request'
responses:
  '201':
    description: Заявка создана.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Response201'
schemas:
  Request:
    type: object
    required: [title]
    properties:
      title:
        type: string
        minLength: 1
  Response201:
    type: object
    required: [id]
    properties:
      id:
        type: integer
