path: /access/list_residents
method: get
summary: Список жильцов домов своей УК
description: Возвращает историю выданных, истёкших и отозванных привязок. Дома другой УК недоступны.
parameters:
  - name: company_id
    in: query
    required: true
    schema:
      type: string
      format: uuid
  - name: house_id
    in: query
    required: false
    schema:
      type: string
      format: uuid
responses:
  '200':
    description: Привязки жильцов с номером квартиры, сроком и сведениями о решении.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Response200'
schemas:
  Response200:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: true
