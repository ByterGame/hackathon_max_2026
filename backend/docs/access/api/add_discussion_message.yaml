path: /access/add_discussion_message
method: post
summary: Добавить сообщение в обсуждение заявки
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/schemas/Request'
responses:
  '201':
    description: Действие выполнено.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Response201'
schemas:
  Request:
    type: object
    required: [request_kind, request_id, text]
    properties:
      request_kind:
        type: string
        enum: [company_registration, house_addition, resident]
      request_id:
        type: string
        format: uuid
      text:
        type: string
        minLength: 1
  Response201:
    type: object
    required: [id, status]
    properties:
      id:
        type: string
        format: uuid
      status:
        type: string
      related_id:
        type: string
        format: uuid
