path: /access/list_requests
method: get
summary: Список доступных заявок
description: Пользователь видит свои заявки, сотрудник УК — заявки своих домов, поддержка — обращения УК. Для заявки жителя ответ содержит address_display подключённого дома.
parameters:
  - name: request_kind
    in: query
    required: true
    schema:
      type: string
      enum: [company_registration, house_addition, resident]
  - name: house_id
    in: query
    required: false
    schema:
      type: string
      format: uuid
responses:
  '200':
    description: Список заявок.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Response200'
schemas:
  Response200:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: true
