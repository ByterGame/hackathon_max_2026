path: /access/respond_resident_offer
method: post
summary: Принять или отклонить предложение
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/schemas/Request'
responses:
  '200':
    description: Действие выполнено.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Response200'
schemas:
  Request:
    type: object
    required: [offer_id, accept]
    properties:
      offer_id:
        type: string
        format: uuid
      accept:
        type: boolean
  Response200:
    type: object
    required: [id, status]
    properties:
      id:
        type: string
        format: uuid
      status:
        type: string
      related_id:
        type: string
        format: uuid
