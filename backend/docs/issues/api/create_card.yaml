path: /issues/create_card
method: post
summary: Сообщить о проблеме дома
requestBody:
  required: true
  content:
    application/json:
      schema: {$ref: '#/schemas/Request'}
responses:
  '201':
    description: Создана общая карточка.
    content:
      application/json:
        schema: {$ref: '#/schemas/Response201'}
schemas:
  TargetApartment:
    type: object
    required: [entrance_number, apartment_number]
    properties:
      entrance_number: {type: integer, minimum: 1}
      apartment_number: {type: integer, minimum: 1}
  Request:
    type: object
    required: [house_id, category_id, title, description, scope_all_house]
    properties:
      house_id: {type: string, format: uuid}
      category_id: {type: string, format: uuid}
      title: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
      scope_all_house: {type: boolean}
      target_entrances:
        type: array
        items: {type: integer, minimum: 1}
      target_apartments:
        type: array
        items: {$ref: '#/schemas/TargetApartment'}
  Response201:
    type: object
    required: [card]
    properties:
      card: {$ref: '../internal/issue_data.yaml#/schemas/Card'}
