path: /issues/create_card
method: post
summary: Сообщить о проблеме дома
requestBody:
  required: true
  content:
    application/json:
      schema: {$ref: '#/schemas/Request'}
responses:
  '201':
    description: Создана общая карточка.
    content:
      application/json:
        schema: {$ref: '#/schemas/Response201'}
schemas:
  Request:
    type: object
    required: [house_id, category_id, title, description, scope]
    properties:
      house_id: {type: string, format: uuid}
      category_id: {type: string, format: uuid}
      title: {type: string, minLength: 1}
      description: {type: string, minLength: 1}
      summary_description:
        type: string
        minLength: 1
        maxLength: 1500
        description: Сводное описание общей карточки. Если отсутствует, берётся исходное описание жителя.
      scope:
        type: string
        enum: [apartment, entrance, house]
        description: Область проблемы. Квартира и подъезд определяются сервером по действующему доступу жителя.
      apartment_id:
        type: string
        format: uuid
        description: Нужен только при нескольких действующих квартирах в доме; значение берётся из /access/list_grants.
  Response201:
    type: object
    required: [card]
    properties:
      card: {$ref: '../internal/issue_data.yaml#/schemas/Card'}
