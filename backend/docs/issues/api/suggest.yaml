path: /issues/suggest
method: post
summary: Предложить название, сводное описание и похожие открытые карточки
requestBody:
  required: true
  content:
    application/json:
      schema: {$ref: '#/schemas/Request'}
responses:
  '200':
    description: Подсказка для проверки жителем; карточка не создаётся и не объединяется.
    content:
      application/json:
        schema: {$ref: '#/schemas/Response200'}
schemas:
  Request:
    type: object
    required: [house_id, description]
    properties:
      house_id: {type: string, format: uuid}
      category_id: {type: string, format: uuid}
      description: {type: string, minLength: 1, maxLength: 1500}
  Candidate:
    type: object
    required: [id, title]
    properties:
      id: {type: string, format: uuid}
      title: {type: string}
  Response200:
    type: object
    required: [suggested_title, summary_description, similar_card_ids, candidates, source, description_check, description_warning]
    properties:
      suggested_title: {type: string}
      summary_description:
        type: [string, 'null']
        maxLength: 500
        description: Сводное описание от ИИ; null, если модель недоступна.
      similar_card_ids:
        type: array
        items: {type: string, format: uuid}
      candidates:
        type: array
        items: {$ref: '#/schemas/Candidate'}
      source: {type: string, enum: [gigachat, local]}
      description_check:
        type: string
        enum: [ok, warning, not_checked]
        description: "ИИ не нашёл замечаний, предложил уточнение либо проверка не проводилась. Поле не запрещает создать заявку."
      description_warning:
        type: [string, 'null']
        description: "Короткое необязательное уточнение от ИИ; null при ok и not_checked."
